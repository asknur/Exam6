databaseChangeLog:
  - changeSet:
      id: 006
      author: Askar
      changes:
        - createTable:
            tableName: rollback_log
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transaction_id
                  type: long
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rollback_tx
                    references: transactions(id)
              - column:
                  name: rolled_back_by
                  type: long
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rollback_admin
                    references: users(id)
              - column:
                  name: rolled_back_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: varchar(500)
