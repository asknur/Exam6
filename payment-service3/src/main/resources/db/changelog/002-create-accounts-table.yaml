databaseChangeLog:
  - changeSet:
      id: 004
      author: Askar
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_number
                  type: varchar(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: long
                  constraints:
                    nullable: false
                    foreignKeyName: fk_accounts_user
                    references: users(id)
              - column:
                  name: currency
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: decimal(19,4)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: accounts
            columnNames: user_id, currency
            constraintName: uq_accounts_user_currency
