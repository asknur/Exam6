server:
  port: 8089

spring:
  application:
    name: Microgram
  mvc:
    static-path-pattern: /static/**

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: jdbc:h2:./db/test;AUTO_SERVER=TRUE
    username: root
    password: 1234
    driver-class-name: org.h2.Driver

  liquibase:
    change-log: classpath:/db/changelog/master.yaml

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  file:
    path: logs
  level:
    kg.attractor.microgram: debug
    com.zaxxer.hikari: error
    org.apache.tomcat: error
    liquibase: error
    root: info
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"